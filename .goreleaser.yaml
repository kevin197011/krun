# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: krun

before:
  hooks:
    - go mod tidy

builds:
  - id: krun
    main: ./cmd/krun
    binary: krun
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: krun
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: kk
    homepage: https://github.com/kevin197011/krun
    maintainer: kk <kevin197011@outlook.com>
    description: |-
      Krun - Ops Script Runner
      Shell and PowerShell scripts for system administration.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    section: utils
    priority: optional
    contents:
      - src: LICENSE
        dst: /usr/share/doc/krun/LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: kevin197011
    name: krun
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
